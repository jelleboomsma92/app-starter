<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2E4739" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyApp" />
  <title>MyApp</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* bhomely:design:start — Bhomely Design System (design/tokens.css + design/bhomely.css + design/bhomely-app.css).
       Don't edit here: change design/ and run design/sync.mjs again. */
/* Bhomely design tokens v1.0 */
:root {
  /* forest */
  --bh-forest-900:#233A2D; --bh-forest-800:#2E4739; --bh-sage-300:#8FBFA6; --bh-forest-50:#EEF3EE;
  /* teal (primary) */
  --bh-teal-600:#3E8C8C; --bh-teal-hover:#357B7B; --bh-teal-700:#2C6B6B; --bh-teal-50:#E4EFEE;
  /* warm accents */
  --bh-mustard-400:#E7B24C; --bh-mustard-hover:#EDBF63; --bh-mustard-ink:#3B2A12; --bh-mustard-50:#F7EBD0; --bh-mustard-text:#6B4B12;
  --bh-oak-400:#B5885A; --bh-oak-50:#F5ECDC; --bh-oak-text:#7A5A36;
  --bh-rust-500:#A9643C; --bh-rust-hover:#94552F; --bh-rust-50:#F5E4DA; --bh-rust-text:#8A4F2E;
  /* neutrals */
  --bh-cream:#F4EFE6; --bh-surface:#FFFFFF; --bh-line:#ECEAE2;
  --bh-ink-900:#2B2620; --bh-ink-600:#6A655C; --bh-ink-400:#8A857B;
  --bh-disabled-fg:#A8A399; --bh-checkbox-border:#C9CFC6;
  --bh-border-hairline:rgba(46,71,57,.10); --bh-border-control:rgba(46,71,57,.20); --bh-scrim:rgba(0,0,0,.28);

  /* semantic */
  --bh-bg:var(--bh-cream); --bh-card:var(--bh-surface); --bh-fg:var(--bh-ink-900); --bh-fg-muted:var(--bh-ink-600); --bh-fg-subtle:var(--bh-ink-400);
  --bh-primary:var(--bh-teal-600); --bh-primary-text:var(--bh-teal-700); --bh-strong:var(--bh-forest-800);
  --bh-highlight:var(--bh-mustard-400); --bh-danger:var(--bh-rust-500);

  /* type */
  --bh-font:'Manrope',system-ui,sans-serif;
  --bh-text-display:800 32px/1.1 var(--bh-font);  --bh-track-display:-0.025em;
  --bh-text-h1:800 25px/1.15 var(--bh-font);      --bh-track-h1:-0.025em;
  --bh-text-h2:700 20px/1.2 var(--bh-font);       --bh-track-h2:-0.02em;
  --bh-text-h3:700 16px/1.25 var(--bh-font);      --bh-track-h3:-0.015em;
  --bh-text-stat:800 24px/1 var(--bh-font);       --bh-track-stat:-0.02em;
  --bh-text-body:500 14px/1.55 var(--bh-font);
  --bh-text-button:700 14px/1 var(--bh-font);
  --bh-text-tag:600 11px/1 var(--bh-font);
  --bh-text-badge:700 10.5px/1 var(--bh-font);
  --bh-text-label:600 11px/1.3 var(--bh-font);
  --bh-text-eyebrow:700 12px/1 var(--bh-font);    --bh-track-eyebrow:0.16em;

  /* space (4px base) */
  --bh-space-1:4px; --bh-space-2:8px; --bh-space-3:12px; --bh-space-4:16px; --bh-space-5:20px; --bh-space-6:24px; --bh-space-7:32px; --bh-space-8:48px;
  /* radius */
  --bh-radius-xs:6px; --bh-radius-sm:8px; --bh-radius-md:11px; --bh-radius-lg:14px; --bh-radius-xl:16px; --bh-radius-2xl:20px; --bh-radius-pill:999px;
  /* elevation */
  --bh-shadow-raised:0 2px 6px -2px rgba(46,71,57,.18);
  --bh-shadow-overlay:0 14px 34px -18px rgba(46,71,57,.40);
  --bh-focus-ring:0 0 0 3px var(--bh-cream),0 0 0 5px var(--bh-teal-600);
  /* motion */
  --bh-ease:cubic-bezier(.2,0,0,1); --bh-dur-fast:150ms; --bh-dur-base:200ms; --bh-dur-emphasis:360ms;
  --bh-header-gradient:linear-gradient(135deg,var(--bh-forest-800),var(--bh-forest-900));
}
/* Bhomely component classes — framework-agnostic. Requires tokens.css. */
.bh-app{background:var(--bh-bg);color:var(--bh-fg);font-family:var(--bh-font);-webkit-font-smoothing:antialiased;min-height:100vh}
.bh-eyebrow{font:var(--bh-text-eyebrow);letter-spacing:var(--bh-track-eyebrow);text-transform:uppercase;color:var(--bh-primary-text)}
.bh-display{font:var(--bh-text-display);letter-spacing:var(--bh-track-display)}
.bh-h1{font:var(--bh-text-h1);letter-spacing:var(--bh-track-h1)}
.bh-h2{font:var(--bh-text-h2);letter-spacing:var(--bh-track-h2)}
.bh-h3{font:var(--bh-text-h3);letter-spacing:var(--bh-track-h3)}
.bh-stat{font:var(--bh-text-stat);letter-spacing:var(--bh-track-stat);color:var(--bh-strong)}
.bh-body{font:var(--bh-text-body);color:var(--bh-fg-muted)}
.bh-label{font:var(--bh-text-label);color:var(--bh-fg-subtle)}
.bh-hl{color:var(--bh-highlight)} .bh-hl-teal{color:var(--bh-teal-600)}

.bh-header{background:var(--bh-header-gradient);padding:26px;color:var(--bh-cream)}
.bh-header .bh-eyebrow{color:var(--bh-sage-300)}

/* Button */
.bh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:none;border-radius:var(--bh-radius-md);font:var(--bh-text-button);cursor:pointer;transition:background var(--bh-dur-fast) var(--bh-ease),box-shadow var(--bh-dur-fast) var(--bh-ease)}
.bh-btn:focus-visible{outline:none;box-shadow:var(--bh-focus-ring)}
.bh-btn--sm{height:32px;padding:0 14px;border-radius:9px;font-size:13px}
.bh-btn--primary{background:var(--bh-teal-600);color:var(--bh-surface)}.bh-btn--primary:hover{background:var(--bh-teal-hover)}.bh-btn--primary:active{background:var(--bh-teal-700)}
.bh-btn--strong{background:var(--bh-forest-800);color:var(--bh-cream)}.bh-btn--strong:hover{background:var(--bh-forest-900)}
.bh-btn--secondary{background:var(--bh-surface);color:var(--bh-forest-800);border:1px solid var(--bh-border-control)}.bh-btn--secondary:hover{background:var(--bh-forest-50)}
.bh-btn--ghost{background:transparent;color:var(--bh-teal-700);padding:0 14px}.bh-btn--ghost:hover{background:var(--bh-teal-50)}
.bh-btn--danger{background:var(--bh-rust-500);color:var(--bh-surface)}.bh-btn--danger:hover{background:var(--bh-rust-hover)}
.bh-btn--fab{background:var(--bh-mustard-400);color:var(--bh-mustard-ink);border-radius:var(--bh-radius-pill);height:36px;padding:0 18px;font-size:13px}.bh-btn--fab:hover{background:var(--bh-mustard-hover)}
.bh-btn--icon{width:42px;height:42px;padding:0;background:var(--bh-surface);color:var(--bh-forest-800);border:1px solid var(--bh-border-control)}.bh-btn--icon:hover{background:var(--bh-forest-50)}
.bh-btn:disabled{background:var(--bh-line);color:var(--bh-disabled-fg);border-color:transparent;cursor:not-allowed}

/* Tag */
.bh-tag{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--bh-radius-sm);font:var(--bh-text-tag);background:var(--bh-forest-50);color:var(--bh-forest-800)}
.bh-tag--teal{background:var(--bh-teal-50);color:var(--bh-teal-700)}
.bh-tag--oak{background:var(--bh-oak-50);color:var(--bh-oak-text)}
.bh-tag--warning{background:var(--bh-mustard-50);color:var(--bh-mustard-text)}
.bh-tag--danger{background:var(--bh-rust-50);color:var(--bh-rust-text)}

/* Badge */
.bh-badge{display:inline-flex;align-items:center;gap:3px;padding:5px 9px;border-radius:var(--bh-radius-pill);font:var(--bh-text-badge)}
.bh-badge--meal{background:var(--bh-mustard-400);color:var(--bh-mustard-ink)}
.bh-badge--done{background:var(--bh-forest-800);color:var(--bh-cream)}
.bh-badge--new{background:var(--bh-teal-600);color:var(--bh-surface)}
.bh-badge--danger{background:var(--bh-rust-500);color:var(--bh-surface)}
.bh-badge--scrim{background:var(--bh-scrim);color:var(--bh-surface)}
.bh-badge--count{min-width:20px;height:20px;padding:0 6px;justify-content:center;background:var(--bh-rust-500);color:var(--bh-surface)}

/* Chip */
.bh-chips{display:flex;flex-wrap:wrap;gap:8px}
.bh-chip{padding:8px 13px;border-radius:var(--bh-radius-pill);font:700 12px/1 var(--bh-font);background:var(--bh-surface);color:var(--bh-forest-800);border:1px solid var(--bh-border-control);cursor:pointer;transition:all var(--bh-dur-fast) var(--bh-ease)}
.bh-chip[aria-pressed="true"]{background:var(--bh-forest-800);border-color:var(--bh-forest-800);color:var(--bh-cream)}
.bh-chip:focus-visible{outline:none;box-shadow:var(--bh-focus-ring)}

/* Card & tile */
.bh-card{background:var(--bh-card);border:1px solid var(--bh-border-hairline);border-radius:var(--bh-radius-xl);overflow:hidden;transition:box-shadow var(--bh-dur-base) var(--bh-ease)}
.bh-card--interactive:hover{box-shadow:var(--bh-shadow-raised)}
.bh-tile{background:var(--bh-card);border:1px solid var(--bh-border-hairline);border-radius:var(--bh-radius-lg);padding:16px}
.bh-tile--inverse{background:var(--bh-forest-800);border-color:transparent;color:var(--bh-cream)}
.bh-tile--inverse .bh-label{color:var(--bh-sage-300)} .bh-tile--inverse .bh-stat{color:var(--bh-cream)}
.bh-progress{height:6px;background:var(--bh-line);border-radius:6px;overflow:hidden}
.bh-progress > span{display:block;height:100%;background:var(--bh-teal-600);border-radius:6px}
.bh-media{position:relative;height:120px;background:linear-gradient(120deg,var(--bh-oak-400),var(--bh-rust-500));background-size:cover;background-position:center}
.bh-media > .bh-badge{position:absolute;top:11px}
.bh-media > .bh-badge:first-child{left:11px} .bh-media > .bh-badge:last-child{right:11px}

/* Habit */
.bh-habit-days{display:flex;gap:6px}
.bh-habit-day{flex:1;aspect-ratio:1;border:none;border-radius:var(--bh-radius-xs);font:700 10.5px/1 var(--bh-font);background:var(--bh-line);color:var(--bh-ink-400);cursor:pointer}
.bh-habit-day[data-state="done"]{background:var(--bh-forest-800);color:var(--bh-surface)}
.bh-habit-day[data-state="today"]{background:var(--bh-teal-600);color:var(--bh-surface)}

/* To-do */
.bh-todo{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 0;background:none;border:none;border-bottom:1px solid var(--bh-line);text-align:left;cursor:pointer;font:600 14px/1.3 var(--bh-font);color:var(--bh-fg)}
.bh-todo:last-child{border-bottom:none}
.bh-check{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--bh-checkbox-border);background:var(--bh-surface);display:grid;place-items:center;color:var(--bh-surface)}
.bh-todo[aria-checked="true"] .bh-check{background:var(--bh-teal-600);border-color:var(--bh-teal-600)}
.bh-todo[aria-checked="true"] .bh-todo__label{color:var(--bh-ink-400);text-decoration:line-through}
.bh-todo__label{flex:1}
/* Bhomely app shell — the parts every Bhomely app shares on top of tokens.css + bhomely.css:
   page, forest app header, icon, panel, inputs, bottom sheet, full-screen page, toast.
   Bhomely's own addition (not from the Claude Design handoff); token values only. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bh-bg); color: var(--bh-fg); font: var(--bh-text-body);
  -webkit-font-smoothing: antialiased; min-height: 100dvh;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
body { padding-bottom: env(safe-area-inset-bottom); }
button, input, select, textarea { font-family: var(--bh-font); }
button { -webkit-appearance: none; appearance: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--bh-focus-ring); }

.bh-icon { width: 20px; height: 20px; flex: none; }
.bh-icon--sm { width: 16px; height: 16px; }
.bh-icon--lg { width: 28px; height: 28px; }

/* App header: forest gradient, edge to edge; one mustard word in the title (.bh-hl) */
.bh-appheader { background: var(--bh-header-gradient); color: var(--bh-cream); padding: calc(22px + env(safe-area-inset-top)) 24px 24px; }
.bh-appheader__inner { max-width: 560px; margin: 0 auto; }
.bh-appheader__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; }
.bh-appheader .bh-eyebrow { color: var(--bh-sage-300); }
.bh-appheader__title { font: var(--bh-text-display); letter-spacing: var(--bh-track-display); margin-top: 14px; }
.bh-appheader__title .bh-hl { color: var(--bh-mustard-400); }
.bh-appheader__sub { font: var(--bh-text-label); color: var(--bh-sage-300); margin-top: 6px; min-height: 14px; }
.bh-appheader__actions { display: flex; gap: 8px; }
/* Compact header for full-screen pages: back button + title on one row */
.bh-appheader--page { padding-bottom: 18px; }
.bh-appheader--page .bh-appheader__top { justify-content: flex-start; }
.bh-appheader--page .bh-appheader__title { font: var(--bh-text-h1); letter-spacing: var(--bh-track-h1); margin-top: 12px; }
/* Icon button on forest: the shape of .bh-btn--icon, translucent cream */
.bh-hbtn {
  width: 42px; height: 42px; flex: none; display: grid; place-items: center;
  border-radius: var(--bh-radius-md); cursor: pointer; color: var(--bh-cream);
  background: color-mix(in srgb, var(--bh-cream) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--bh-cream) 18%, transparent);
  transition: background var(--bh-dur-fast) var(--bh-ease);
}
.bh-hbtn:hover { background: color-mix(in srgb, var(--bh-cream) 15%, transparent); }

.bh-main { max-width: 560px; margin: 0 auto; padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 16px; }
.bh-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bh-section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

/* Panel: a card with icon, title, text and actions (banners, notices, load status) */
.bh-panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bh-panel__head { display: flex; align-items: flex-start; gap: 12px; }
.bh-panel__icon { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--bh-radius-md); background: var(--bh-teal-50); color: var(--bh-teal-700); }
.bh-panel__icon--danger { background: var(--bh-rust-50); color: var(--bh-rust-text); }
.bh-panel__text { flex: 1; min-width: 0; }
.bh-panel__text .bh-h3 { font-size: 15px; }
.bh-panel__text .bh-body { font-size: 13px; margin-top: 2px; }
.bh-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bh-dismiss {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center; border: none; border-radius: var(--bh-radius-sm);
  background: none; color: var(--bh-fg-subtle); cursor: pointer; transition: background var(--bh-dur-fast) var(--bh-ease);
}
.bh-dismiss:hover { background: var(--bh-forest-50); color: var(--bh-forest-800); }
.bh-dismiss { position: relative; }
.bh-dismiss::after { content: ''; position: absolute; inset: -6px; }

/* Inputs */
.bh-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bh-input, .bh-select, .bh-textarea {
  width: 100%; min-width: 0; border-radius: var(--bh-radius-md); border: 1px solid var(--bh-border-control);
  background: var(--bh-surface); color: var(--bh-fg); font: 600 14px/1.3 var(--bh-font);
}
.bh-input, .bh-select { height: 40px; padding: 0 14px; }
.bh-textarea { padding: 10px 14px; min-height: 76px; resize: vertical; font-weight: 500; line-height: 1.5; }
.bh-input::placeholder, .bh-textarea::placeholder { color: var(--bh-fg-subtle); font-weight: 500; }
.bh-input:focus, .bh-select:focus, .bh-textarea:focus { outline: none; box-shadow: var(--bh-focus-ring); border-color: transparent; }
.bh-search { position: relative; }
.bh-search .bh-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--bh-fg-subtle); pointer-events: none; }
.bh-search .bh-input { padding-left: 40px; }

/* Bottom sheet over a scrim */
.bh-scrim {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  background: color-mix(in srgb, var(--bh-ink-900) 40%, transparent);
  animation: bh-fade var(--bh-dur-base) var(--bh-ease);
}
.bh-sheet {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--bh-surface);
  border-radius: var(--bh-radius-2xl) var(--bh-radius-2xl) 0 0; box-shadow: var(--bh-shadow-overlay);
  padding: 10px 24px calc(24px + env(safe-area-inset-bottom)); animation: bh-rise var(--bh-dur-emphasis) var(--bh-ease);
}
.bh-sheet--cream { background: var(--bh-bg); }
.bh-sheet__handle { width: 40px; height: 4px; border-radius: 4px; background: var(--bh-line); margin: 0 auto 18px; }
.bh-sheet--cream .bh-sheet__handle { background: var(--bh-border-control); }
.bh-sheet__title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.bh-sheet__body { display: flex; flex-direction: column; gap: 14px; }
.bh-sheet__foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* Full-screen page (over the app): forest page header, cream body */
.bh-page { position: fixed; inset: 0; z-index: 15; background: var(--bh-bg); overflow-y: auto; animation: bh-fade var(--bh-dur-base) var(--bh-ease); }

@keyframes bh-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bh-rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bh-scrim, .bh-sheet, .bh-page { animation: none; } }

/* Toast */
.bh-toast {
  position: fixed; left: 50%; z-index: 30; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 48px); display: flex; align-items: center; gap: 8px;
  background: var(--bh-forest-800); color: var(--bh-cream); border-radius: var(--bh-radius-pill);
  padding: 11px 18px; font: 600 13px/1.3 var(--bh-font); box-shadow: var(--bh-shadow-overlay); pointer-events: none;
}
.bh-toast .bh-icon { color: var(--bh-sage-300); }

/* Tap targets: chips look 30px tall (design spec) but take taps over 44px */
.bh-chip { position: relative; }
.bh-chip::after { content: ''; position: absolute; left: 0; right: 0; top: -7px; bottom: -7px; }

/* Loading */
.bh-loading { padding: 20px 16px; text-align: center; }
    /* bhomely:design:end */

    /* ── App-specific classes below, --bh-* tokens only. Rename the app- prefix to the app's own
       (Meadlog ml-, Lembas lb-, Pennywise pw-). ── */
    .app-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* A card with tappable rows */
    .app-list { padding: 0 16px; }
    .app-row {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0;
      background: none; border: none; border-bottom: 1px solid var(--bh-line);
      text-align: left; cursor: pointer; font: inherit; color: inherit;
    }
    .app-row:last-child { border-bottom: none; }
    .app-row:focus-visible { border-radius: var(--bh-radius-xs); }
    .app-row-main { flex: 1; min-width: 0; }
    .app-row-title { display: block; font: 600 14px/1.25 var(--bh-font); color: var(--bh-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-row-sub { display: block; font: var(--bh-text-label); color: var(--bh-fg-subtle); margin-top: 3px; }
    .app-row > .bh-icon:last-child { color: var(--bh-fg-subtle); }
    .app-row-icon { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--bh-radius-md); background: var(--bh-forest-50); color: var(--bh-forest-800); }

    .app-sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .app-sheet-actions .bh-btn { width: 100%; height: 44px; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const APP_NAME = 'MyApp';
const VERSION  = '0.1';
const MAX_NAME = 200;

/* ─────────────────────────────────────────
   Icons: Lucide (lucide-static, ISC licence), only the ones the app uses, as [tag, attributes]
   per shape, built with createElementNS. Add more with the same data format.
───────────────────────────────────────── */
const ICONS = {
  'plus': [['path',{d:'M5 12h14'}],['path',{d:'M12 5v14'}]],
  'x': [['path',{d:'M18 6 6 18'}],['path',{d:'m6 6 12 12'}]],
  'check': [['path',{d:'M20 6 9 17l-5-5'}]],
  'chevron-right': [['path',{d:'m9 18 6-6-6-6'}]],
  'inbox': [['polyline',{points:'22 12 16 12 14 15 10 15 8 12 2 12'}],['path',{d:'M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z'}]],
  'log-in': [['path',{d:'m10 17 5-5-5-5'}],['path',{d:'M15 12H3'}],['path',{d:'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4'}]],
  'refresh-cw': [['path',{d:'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8'}],['path',{d:'M21 3v5h-5'}],['path',{d:'M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16'}],['path',{d:'M8 16H3v5'}]]
};

/* ─────────────────────────────────────────
   API data layer
   The API lives in the same Worker, under /api (same origin, no CORS).
   An expired Access login comes back as a redirect (or 401) and throws
   an error with signedOut = true.
───────────────────────────────────────── */
const API = '/api';

async function apiFetch(path, options = {}) {
  let res;
  try {
    res = await fetch(`${API}${path}`, { ...options, credentials: 'same-origin', redirect: 'manual', cache: 'no-store' });
  } catch (e) {
    throw new Error('No connection');
  }
  if (res.type === 'opaqueredirect' || res.status === 401) {
    const e = new Error('You are signed out');
    e.signedOut = true;
    throw e;
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`Server error ${res.status}`);
  }
  if (!res.ok) throw new Error(data?.error || `Server error ${res.status}`);
  return data;
}

function apiGet(path)         { return apiFetch(path); }
function apiPost(path, body)  { return apiFetch(path, { method: 'POST',   headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function apiPut(path, body)   { return apiFetch(path, { method: 'PUT',    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function apiDelete(path)      { return apiFetch(path, { method: 'DELETE' }); }

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */
const state = {
  loadState:  'loading',   // 'loading' | 'ready' | 'error'
  loadError:  null,        // Error from the API; .signedOut when the Access login has expired
  view:       'all',       // chip in the toolbar (add views to VIEWS)
  sheet:      null,        // null | { type: 'item', id: null (new) or the item's id }
  draftName:  '',          // the name field in the item sheet
  busy:       false,
  toast:      null,
  toastTimer: null,
  items:      [],
};

/* ─────────────────────────────────────────
   Data: loading and named actions (the UI never calls fetch itself)
───────────────────────────────────────── */
async function loadData() {
  state.loadState = 'loading';
  render();
  try {
    state.items     = await apiGet('/items');
    state.loadState = 'ready';
    state.loadError = null;
  } catch (e) {
    state.loadState = 'error';
    state.loadError = e;
  }
  render();
}

async function addItem(name) {
  const item = await apiPost('/items', { id: crypto.randomUUID(), name });
  state.items = [...state.items, item].sort((a, b) => a.name.localeCompare(b.name));
  return item;
}

async function renameItem(id, name) {
  await apiPut(`/items/${encodeURIComponent(id)}`, { name });
  state.items = state.items.map((i) => (i.id === id ? { ...i, name } : i)).sort((a, b) => a.name.localeCompare(b.name));
}

async function removeItem(id) {
  await apiDelete(`/items/${encodeURIComponent(id)}`);
  state.items = state.items.filter((i) => i.id !== id);
}

/* ─────────────────────────────────────────
   Agent access: plain JSON summary of the current state
───────────────────────────────────────── */
function getAppSummary() {
  return {
    app:       APP_NAME,
    version:   VERSION,
    loadState: state.loadState === 'error' && state.loadError?.signedOut ? 'signed-out' : state.loadState,
    itemCount: state.items.length,
    items:     state.items.map((i) => ({ id: i.id, name: i.name, createdBy: i.created_by })),
  };
}

/* ─────────────────────────────────────────
   DOM helpers: el(), icon(), fragment()
───────────────────────────────────────── */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined) continue;
      if      (k === 'className')                    { node.className = v; }
      else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) { node.style[sk] = sv; }
      }
      else if (k === 'onClick')   { node.addEventListener('click',   v); }
      else if (k === 'onChange')  { node.addEventListener('change',  v); }
      else if (k === 'onKeydown') { node.addEventListener('keydown', v); }
      else if (k === 'onInput')   { node.addEventListener('input',   v); }
      else { node.setAttribute(k, v); }
    }
  }
  for (const child of children) {
    if (child == null || child === false) continue;
    if (typeof child === 'string' || typeof child === 'number') {
      node.appendChild(document.createTextNode(String(child)));
    } else {
      node.appendChild(child);
    }
  }
  return node;
}

function icon(name, extraClass) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const base = { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.75', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', class: `bh-icon${extraClass ? ' ' + extraClass : ''}` };
  for (const [k, v] of Object.entries(base)) svg.setAttribute(k, v);
  for (const [tag, attrs] of ICONS[name] || []) {
    const shape = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) shape.setAttribute(k, v);
    svg.appendChild(shape);
  }
  return svg;
}

function fragment(...nodes) {
  const f = document.createDocumentFragment();
  for (const n of nodes) if (n) f.appendChild(n);
  return f;
}

function showToast(msg) {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toast = msg;
  render();
  state.toastTimer = setTimeout(() => { state.toast = null; render(); }, 2400);
}

/* ─────────────────────────────────────────
   Shared building blocks (the same in every Bhomely app)
───────────────────────────────────────── */
function buildHeader() {
  const sub = state.loadState === 'ready' ? `${state.items.length} item${state.items.length === 1 ? '' : 's'}` : '';
  return el('header', { className: 'bh-appheader' },
    el('div', { className: 'bh-appheader__inner' },
      el('div', { className: 'bh-appheader__top' },
        el('div', { className: 'bh-eyebrow' }, `${APP_NAME} · v${VERSION}`)
        /* Header buttons go here: el('button', { className: 'bh-hbtn', 'aria-label': 'Settings', onClick }, icon('settings')) */
      ),
      /* One word of the title in mustard */
      el('h1', { className: 'bh-appheader__title' }, 'Your ', el('span', { className: 'bh-hl' }, 'items')),
      el('div', { className: 'bh-appheader__sub' }, sub)
    )
  );
}

function buildPanel(iconName, title, body, actions, danger) {
  return el('div', { className: 'bh-card bh-panel' },
    el('div', { className: 'bh-panel__head' },
      el('div', { className: `bh-panel__icon${danger ? ' bh-panel__icon--danger' : ''}` }, icon(iconName)),
      el('div', { className: 'bh-panel__text' },
        el('div', { className: 'bh-h3' }, title),
        body ? el('div', { className: 'bh-body' }, body) : null
      )
    ),
    actions ? el('div', { className: 'bh-actions' }, actions) : null
  );
}

/* Bottom sheet over a scrim; tapping the scrim or the cross calls onClose */
function buildSheet(title, body, onClose) {
  const sheet = el('div', {
    className: 'bh-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title,
    onClick: (e) => e.stopPropagation(),
  },
    el('div', { className: 'bh-sheet__handle' }),
    el('div', { className: 'bh-sheet__title' },
      el('h2', { className: 'bh-h2' }, title),
      el('button', { className: 'bh-dismiss', 'aria-label': 'Close', onClick: onClose }, icon('x'))
    ),
    body
  );
  return el('div', { className: 'bh-scrim', onClick: onClose }, sheet);
}

function buildLoadStatus() {
  if (state.loadState === 'loading') {
    return el('div', { className: 'bh-card bh-loading' }, el('span', { className: 'bh-label' }, 'Loading…'));
  }
  const e = state.loadError || {};
  /* A fresh URL makes the browser (and the network-first service worker) go through the Access login */
  const signIn = () => { window.location.href = `/?login=${Date.now()}`; };
  return e.signedOut
    ? buildPanel('log-in', 'You are signed out', 'Sign in again to continue.',
        el('button', { className: 'bh-btn bh-btn--primary', onClick: signIn }, 'Sign in again'))
    : buildPanel('refresh-cw', `Could not load ${APP_NAME}`, `${e.message || 'Unknown error'}. Your data is safe.`,
        el('button', { className: 'bh-btn bh-btn--secondary', onClick: loadData }, 'Retry'));
}

function buildToast() {
  if (!state.toast) return null;
  const msg = String(state.toast);
  const ok = msg.startsWith('✓');
  return el('div', { className: 'bh-toast', role: 'status' },
    ok ? icon('check', 'bh-icon--sm') : null,
    ok ? msg.slice(1).trim() : msg
  );
}

/* ─────────────────────────────────────────
   Toolbar: view chips (single choice) + the one primary action
   Add views to VIEWS; with one view the chips are hidden.
───────────────────────────────────────── */
const VIEWS = [{ key: 'all', label: 'All' }];

function buildToolbar() {
  const chips = VIEWS.length > 1
    ? el('div', { className: 'bh-chips', role: 'group', 'aria-label': 'View' },
        ...VIEWS.map((v) => el('button', {
          className: 'bh-chip', 'aria-pressed': String(state.view === v.key),
          onClick: () => { state.view = v.key; render(); },
        }, v.label)))
    : el('span');   /* keeps the button on the right; the header already shows the count */
  return el('div', { className: 'app-toolbar' },
    chips,
    el('button', { className: 'bh-btn bh-btn--primary bh-btn--sm', onClick: () => openItemSheet(null) }, icon('plus', 'bh-icon--sm'), 'Add item')
  );
}

/* ─────────────────────────────────────────
   Items (starter example: replace with the app's own screens)
───────────────────────────────────────── */
function buildItems() {
  if (!state.items.length) {
    return buildPanel('inbox', 'Nothing here yet', 'Add your first item to get started.');
  }
  return el('div', { className: 'bh-card app-list' },
    ...state.items.map((item) => el('button', { className: 'app-row', onClick: () => openItemSheet(item.id) },
      el('span', { className: 'app-row-main' },
        el('span', { className: 'app-row-title' }, item.name),
        el('span', { className: 'app-row-sub' }, `Added by ${item.created_by || 'someone'}`)
      ),
      icon('chevron-right')
    ))
  );
}

function openItemSheet(id) {
  const item = state.items.find((i) => i.id === id);
  state.sheet = { type: 'item', id: item ? item.id : null };
  state.draftName = item ? item.name : '';
  render();
  document.getElementById('app-item-name')?.focus();
}

const closeSheet = () => { if (state.busy) return; state.sheet = null; render(); };

async function saveItemSheet() {
  const name = state.draftName.trim();
  if (!name) { showToast('Enter a name'); return; }
  if (name.length > MAX_NAME) { showToast('The name is too long'); return; }
  const id = state.sheet.id;
  state.busy = true;
  render();
  try {
    if (id) await renameItem(id, name);
    else await addItem(name);
    state.busy = false;
    state.sheet = null;
    showToast(id ? '✓ Saved' : '✓ Added');
  } catch (e) {
    state.busy = false;
    showToast(e.signedOut ? 'Not saved: you are signed out' : `Not saved: ${e.message}`);
  }
}

async function deleteItemSheet() {
  const id = state.sheet.id;
  if (!window.confirm('Delete this item?')) return;
  state.busy = true;
  render();
  try {
    await removeItem(id);
    state.busy = false;
    state.sheet = null;
    showToast('✓ Deleted');
  } catch (e) {
    state.busy = false;
    showToast(e.signedOut ? 'Not deleted: you are signed out' : `Not deleted: ${e.message}`);
  }
}

function buildItemSheet() {
  const isNew = !state.sheet.id;
  const input = el('input', {
    id: 'app-item-name', className: 'bh-input', type: 'text', placeholder: 'Name', maxlength: String(MAX_NAME),
    onInput: (e) => { state.draftName = e.target.value; },
    onKeydown: (e) => { if (e.key === 'Enter') saveItemSheet(); },
  });
  input.value = state.draftName;
  const save = el('button', { className: 'bh-btn bh-btn--primary', onClick: saveItemSheet }, state.busy ? 'Saving…' : isNew ? 'Add' : 'Save');
  if (state.busy) save.disabled = true;
  return buildSheet(isNew ? 'New item' : 'Edit item', fragment(
    el('label', { className: 'bh-field' }, el('span', { className: 'bh-label' }, 'Name'), input),
    el('div', { className: 'app-sheet-actions' },
      save,
      isNew ? null : el('button', { className: 'bh-btn bh-btn--ghost', onClick: deleteItemSheet }, 'Delete item')
    )
  ), closeSheet);
}

/* ─────────────────────────────────────────
   Render: rebuilds the page from state. Keeps the sheet's scroll position and the focused
   field (a toast also re-renders).
───────────────────────────────────────── */
function render() {
  const root = document.getElementById('app');
  const oldSheet = root.querySelector('.bh-sheet');
  const sheetKey = oldSheet?.getAttribute('aria-label');
  const sheetScroll = oldSheet ? oldSheet.scrollTop : 0;
  const active = document.activeElement;
  const focusId = active?.id && root.contains(active) ? active.id : null;
  let sel = null;
  if (focusId) { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }

  root.innerHTML = '';
  root.appendChild(buildHeader());
  const main = el('main', { className: 'bh-main' });
  if (state.loadState !== 'ready') {
    main.appendChild(buildLoadStatus());
  } else {
    main.appendChild(buildToolbar());
    main.appendChild(buildItems());
  }
  root.appendChild(main);

  if (state.loadState === 'ready' && state.sheet?.type === 'item') {
    const sheet = buildItemSheet();
    root.appendChild(sheet);
    const newSheet = sheet.querySelector('.bh-sheet');
    if (sheetKey && newSheet.getAttribute('aria-label') === sheetKey) newSheet.scrollTop = sheetScroll;
  }

  const toast = buildToast();
  if (toast) root.appendChild(toast);

  if (focusId) {
    const again = document.getElementById(focusId);
    if (again) {
      again.focus();
      if (sel && sel[0] !== null) { try { again.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } }
    }
  }
}

/* ─────────────────────────────────────────
   Init
───────────────────────────────────────── */
loadData();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('SW:', e));
}
</script>
</body>
</html>
