<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111009" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyApp" />
  <title>MyApp</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #111009;
      --bg2:       #17150f;
      --bg3:       #1e1b13;
      --surface:   #221f16;
      --surface2:  #2a271c;
      --border:    #2e2b1f;
      --border2:   #3a3628;
      --text:      #f0ead8;
      --text2:     #a89e85;
      --text3:     #5c5542;
      --accent:     #6a9e72;
      --accent-lt:  #92bf98;
      --accent-dim: #3a5e3f;
      --c-green:    #4a8c5c;
      --c-green-bg: #0f1f14;
      --c-green-t:  #7dc494;
      --c-yellow:    #c4a832;
      --c-yellow-bg: #1f1a08;
      --c-yellow-t:  #e8d070;
      --c-orange:    #c46832;
      --c-orange-bg: #1f1008;
      --c-orange-t:  #e89060;
      --c-red:       #b83232;
      --c-red-bg:    #1f0808;
      --c-red-t:     #e07070;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-mono:    'JetBrains Mono', 'Courier New', monospace;
      --radius:    12px;
      --radius-sm: 7px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: var(--font-mono);
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #app {
      max-width: 580px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Buttons ── */
    .btn-primary {
      padding: 10px 16px;
      background: var(--accent-dim); border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--accent-lt); font-family: var(--font-mono); font-size: 12px;
      cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px;
    }
    .btn-primary:hover { background: var(--accent); color: var(--bg); }

    .btn-cancel {
      padding: 10px 16px;
      background: transparent; border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text2); font-family: var(--font-mono); font-size: 12px;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-cancel:hover { border-color: var(--text3); }

    .btn-danger {
      padding: 10px 18px;
      background: var(--c-red-bg); border: 1px solid var(--c-red);
      border-radius: var(--radius-sm);
      color: var(--c-red-t); font-family: var(--font-mono); font-size: 12px;
      cursor: pointer; transition: all 0.15s; flex: 1;
    }
    .btn-danger:hover { background: var(--c-red); color: var(--text); }

    .btn-icon {
      background: transparent; border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text2); font-family: var(--font-mono); font-size: 11px;
      padding: 5px 10px; cursor: pointer; transition: all 0.15s;
    }
    .btn-icon:hover { border-color: var(--text3); color: var(--text); }
    .btn-icon.danger { color: var(--c-red-t); border-color: var(--c-red); }
    .btn-icon.danger:hover { background: var(--c-red-bg); }

    .btn-dismiss {
      background: transparent; border: none;
      color: var(--text3); font-size: 20px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: var(--radius-sm);
      transition: color 0.15s;
    }
    .btn-dismiss:hover { color: var(--text); }

    /* ── Form elements ── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-row   { display: flex; gap: 12px; }
    .form-label { font-size: 10px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }

    .text-input {
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text); font-family: var(--font-mono); font-size: 13px;
      padding: 10px 12px; width: 100%;
      outline: none; transition: border-color 0.15s;
    }
    .text-input:focus { border-color: var(--accent-dim); }

    .textarea-input {
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text); font-family: var(--font-mono); font-size: 12px;
      padding: 10px 12px; width: 100%;
      outline: none; transition: border-color 0.15s;
      resize: vertical;
    }
    .textarea-input:focus { border-color: var(--accent-dim); }

    /* ── Header ── */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .app-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 600; color: var(--text);
    }
    .app-version { font-size: 9px; color: var(--text3); letter-spacing: 0.5px; margin-top: 2px; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex; gap: 4px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1; padding: 8px 4px;
      background: transparent; border: none;
      color: var(--text3); font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.5px; text-transform: uppercase;
      cursor: pointer; border-radius: 8px; transition: all 0.15s;
    }
    .tab-btn.active { background: var(--surface2); color: var(--text); }
    .tab-btn:hover:not(.active) { color: var(--text2); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100; display: flex; align-items: flex-end;
      animation: fadeIn 0.2s ease;
    }
    .modal {
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 580px; margin: 0 auto;
      max-height: 90vh; display: flex; flex-direction: column;
      animation: scaleIn 0.25s ease;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--border2); border-radius: 2px;
      margin: 10px auto 0;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-heading { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
    .modal-body    { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer  { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 40px; padding: 8px 18px;
      font-size: 11px; color: var(--text2); font-family: var(--font-mono);
      z-index: 300; animation: fadeUp 0.3s ease;
      white-space: nowrap; pointer-events: none;
    }

    /* ── Empty state ── */
    .empty-state {
      border: 1px dashed var(--border2); border-radius: var(--radius);
      padding: 40px 20px; text-align: center;
      animation: fadeIn 0.3s ease both;
    }
    .empty-state-title { font-family: var(--font-display); font-size: 20px; color: var(--text2); font-weight: 600; margin-bottom: 6px; }
    .empty-state-sub   { font-size: 11px; color: var(--text3); }

    /* ── Misc ── */
    .divider      { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .no-data      { font-size: 11px; color: var(--text3); padding: 16px 0; text-align: center; letter-spacing: 0.5px; }
    .confirm-text { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }

    /* ─────────────────────────────────────────
       App-specific styles go below this line
    ───────────────────────────────────────── */

  </style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const APP_NAME = 'MyApp';
const VERSION  = '0.1';

/* ─────────────────────────────────────────
   API data layer
   Replace the URL after creating your Worker.
───────────────────────────────────────── */
const API = 'https://my-app-api.YOUR-ACCOUNT.workers.dev';

async function apiFetch(path, options = {}) {
  const res  = await fetch(`${API}${path}`, { credentials: 'include', ...options });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error || `API error ${res.status}`);
  return data;
}

function apiGet(path)         { return apiFetch(path); }
function apiPost(path, body)  { return apiFetch(path, { method: 'POST',   headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function apiPut(path, body)   { return apiFetch(path, { method: 'PUT',    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function apiDelete(path)      { return apiFetch(path, { method: 'DELETE' }); }

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */
const state = {
  tab:        'home',
  loading:    false,
  loadError:  null,
  modal:      null,
  toast:      null,
  toastTimer: null,
  items:      [],
};

/* ─────────────────────────────────────────
   Data loading
───────────────────────────────────────── */
async function loadData() {
  state.loading = true;
  render();
  try {
    state.items   = await apiGet('/items');
    state.loading = false;
    render();
  } catch (e) {
    state.loading  = false;
    state.loadError = e.message;
    render();
  }
}

/* ─────────────────────────────────────────
   el() DOM helper
───────────────────────────────────────── */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if      (k === 'className')                    { node.className = v; }
      else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) { node.style[sk] = sv; }
      }
      else if (k === 'onClick')   { node.addEventListener('click',   v); }
      else if (k === 'onChange')  { node.addEventListener('change',  v); }
      else if (k === 'onKeydown') { node.addEventListener('keydown', v); }
      else if (k === 'onInput')   { node.addEventListener('input',   v); }
      else { node.setAttribute(k, v); }
    }
  }
  for (const child of children) {
    if (child == null || child === false) continue;
    if (typeof child === 'string' || typeof child === 'number') {
      node.appendChild(document.createTextNode(String(child)));
    } else {
      node.appendChild(child);
    }
  }
  return node;
}

/* ─────────────────────────────────────────
   Utilities
───────────────────────────────────────── */
function showToast(msg) {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toast = msg;
  render();
  state.toastTimer = setTimeout(() => {
    state.toast = null;
    const t = document.querySelector('.toast');
    if (t) t.remove();
  }, 2400);
}

/* ─────────────────────────────────────────
   Modal shell
───────────────────────────────────────── */
function buildModalShell(title) {
  const overlay = el('div', {
    className: 'modal-overlay',
    onClick: e => { if (e.target === overlay) { state.modal = null; render(); } }
  });
  const modal = el('div', { className: 'modal' });
  modal.appendChild(el('div', { className: 'modal-handle' }));
  const hdr = el('div', { className: 'modal-header' });
  hdr.appendChild(el('div', { className: 'modal-heading' }, title));
  hdr.appendChild(el('button', {
    className: 'btn-dismiss',
    onClick: () => { state.modal = null; render(); }
  }, '×'));
  modal.appendChild(hdr);
  modal.appendChild(el('div', { className: 'modal-body' }));
  modal.appendChild(el('div', { className: 'modal-footer' }));
  overlay.appendChild(modal);
  return overlay;
}

/* ─────────────────────────────────────────
   Header
───────────────────────────────────────── */
function buildHeader() {
  const wrap = el('div', { className: 'app-header' });
  const left = el('div', {});
  left.appendChild(el('div', { className: 'app-title' }, APP_NAME));
  left.appendChild(el('div', { className: 'app-version' }, `v${VERSION}`));
  wrap.appendChild(left);
  return wrap;
}

/* ─────────────────────────────────────────
   Tab: Home (starter placeholder)
───────────────────────────────────────── */
function buildHomeTab() {
  const wrap = el('div', {});

  if (state.items.length === 0) {
    const empty = el('div', { className: 'empty-state' });
    empty.appendChild(el('div', { className: 'empty-state-title' }, 'Nothing here yet'));
    empty.appendChild(el('div', { className: 'empty-state-sub' }, 'Add your first item to get started'));
    empty.appendChild(el('button', {
      className: 'btn-primary',
      style: { marginTop: '16px' },
      onClick: () => { state.modal = { type: 'add' }; render(); }
    }, '+ Add item'));
    wrap.appendChild(empty);
    return wrap;
  }

  for (const item of state.items) {
    const card = el('div', {
      style: {
        padding: '14px', marginBottom: '10px',
        background: 'var(--surface)', border: '1px solid var(--border)',
        borderRadius: 'var(--radius)', cursor: 'pointer',
        animation: 'fadeUp 0.2s ease both',
      },
      onClick: () => { state.modal = { type: 'item', data: item }; render(); }
    });
    card.appendChild(el('div', { style: { fontSize: '14px', color: 'var(--text)' } }, item.name));
    wrap.appendChild(card);
  }

  return wrap;
}

/* ─────────────────────────────────────────
   Tab bar — update TABS when you add tabs
───────────────────────────────────────── */
const TABS = ['home'];

function buildTabBar() {
  const bar = el('div', { className: 'tab-bar' });
  for (const t of TABS) {
    bar.appendChild(el('button', {
      className: `tab-btn${state.tab === t ? ' active' : ''}`,
      onClick: () => { state.tab = t; render(); }
    }, t.charAt(0).toUpperCase() + t.slice(1)));
  }
  return bar;
}

/* ─────────────────────────────────────────
   Render
───────────────────────────────────────── */
function render() {
  const root = document.getElementById('app');
  root.innerHTML = '';

  if (state.loading) {
    const wrap = el('div', { style: { padding: '60px 20px', textAlign: 'center' } });
    wrap.appendChild(el('div', { style: { fontFamily: 'var(--font-display)', fontSize: '26px', color: 'var(--text2)', marginBottom: '10px' } }, APP_NAME));
    wrap.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--text3)', letterSpacing: '1px' } }, 'Loading…'));
    root.appendChild(wrap);
    return;
  }

  if (state.loadError) {
    const wrap = el('div', { style: { padding: '40px 20px', textAlign: 'center' } });
    wrap.appendChild(el('div', { style: { fontSize: '12px', color: 'var(--c-red-t)', marginBottom: '12px' } }, `Could not connect: ${state.loadError}`));
    wrap.appendChild(el('button', { className: 'btn-primary', onClick: () => { state.loadError = null; loadData(); } }, 'Retry'));
    root.appendChild(wrap);
    return;
  }

  root.appendChild(buildHeader());
  if (TABS.length > 1) root.appendChild(buildTabBar());

  if (state.tab === 'home') root.appendChild(buildHomeTab());

  if (state.modal) {
    /* Add modal builders here: { type: 'add': buildAddModal, ... } */
  }

  if (state.toast) root.appendChild(el('div', { className: 'toast' }, state.toast));
}

/* ─────────────────────────────────────────
   Init
───────────────────────────────────────── */
loadData();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW:', e));
}
</script>
</body>
</html>
